<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e7">
  <title>Steamcup · 给 Mac 续一杯</title>
  <meta name="description" content="给 Mac 续一杯。Steamcup 是开源的 macOS 菜单栏防睡眠工具：复制一行命令，或交给你的 Agent 安装。">
  <meta property="og:title" content="Steamcup · 给 Mac 续一杯">
  <meta property="og:description" content="合上电脑，让任务接着跑。复制一行命令，或交给 Agent 安装。">
  <meta property="og:image" content="https://longado.github.io/steamcup/media/steamcup-icon.png">
  <meta property="og:url" content="https://longado.github.io/steamcup/">
  <link rel="icon" href="media/steamcup-icon.png">
  <style>
    :root {
      color-scheme: light;
      --paper: #faf6ef;
      --ink: #38251c;
      --muted: #8a7665;
      --accent: #b9693e;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    button, a { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
    .page { max-width: 1200px; min-height: 100svh; margin: auto; padding: 0 42px; display: flex; flex-direction: column; }
    header { height: 88px; flex: none; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: inline-flex; align-items: center; transition: transform .25s; }
    .brand:hover { transform: rotate(-8deg); }
    .brand img { width: 36px; height: 36px; image-rendering: pixelated; }
    nav { display: flex; gap: 27px; align-items: center; font-size: 14px; }
    nav a { transition: color .2s; }
    nav a:hover, footer a:hover { color: var(--accent); }
    main { position: relative; isolation: isolate; width: 100%; max-width: 810px; flex: 1; margin: auto; padding: 35px 0 58px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .aura {
      position: absolute; width: min(650px, 100%); height: 610px; top: -50px; left: 50%;
      pointer-events: none; z-index: -1;
      background: radial-gradient(ellipse, #dfb87c2e 0%, #edc89a17 35%, transparent 68%);
      transform: translate(-50%, 0) translate3d(var(--aura-x, 0px), var(--aura-y, 0px), 0);
      transition: transform 1.2s cubic-bezier(.2,.7,.2,1);
      animation: breathe 7s ease-in-out infinite alternate;
    }
    .hero-art { margin: 0 auto; width: 160px; height: 160px; position: relative; animation: arrive .9s both; }
    .cup-stage {
      width: 160px; height: 160px; padding: 0; display: block; position: relative;
      border: 0; background: transparent; color: var(--accent); perspective: 700px;
      transform: translate3d(var(--cup-x, 0px), var(--cup-y, 0px), 0);
      transition: transform .6s cubic-bezier(.2,.7,.2,1);
    }
    .cup-bob { display: block; width: 100%; height: 100%; position: relative; animation: float 5s ease-in-out infinite; }
    .cup-bob::after {
      content: ""; position: absolute; width: 88px; height: 12px; left: 36px; bottom: -10px;
      background: #6e442023; border-radius: 50%; filter: blur(8px);
      animation: shadow 5s ease-in-out infinite;
    }
    .cup-icon { width: 160px; height: 160px; display: block; image-rendering: pixelated; transition: transform .4s cubic-bezier(.2,.7,.2,1); }
    .cup-stage:hover .cup-icon { transform: rotate(-5deg) scale(1.055); }
    .cup-stage:active .cup-icon { transform: rotate(3deg) scale(.97); }
    .steam { position: absolute; width: 160px; height: 112px; top: -48px; left: 0; overflow: visible; pointer-events: none; }
    .steam path { fill: none; stroke: #ad754c; stroke-width: 2.2; stroke-linecap: round; opacity: 0; animation: steam 3.5s ease-out infinite; }
    .steam path:nth-child(2) { animation-delay: -1.2s; }
    .steam path:nth-child(3) { animation-delay: -2.3s; }
    .cup-stage.brewing .cup-icon { animation: clink .65s ease-in-out; }
    .cup-stage.brewing .steam path { stroke-width: 3; animation-duration: 1.5s; }
    .brew-ring { position: absolute; inset: 12px; border: 1px solid #bb8555; border-radius: 50%; pointer-events: none; opacity: 0; }
    .cup-stage.brewing .brew-ring { animation: ripple 1.25s ease-out; }
    h1 { font: 400 clamp(76px, 8vw, 112px)/1.08 Georgia, "Times New Roman", serif; letter-spacing: -7px; margin: 29px 0 0; animation: arrive .9s .08s both; }
    h1 span { color: var(--accent); }
    .tagline { font-size: 20px; letter-spacing: .8px; margin: 21px 0 0; line-height: 1.6; animation: arrive .9s .14s both; }
    .install { margin: 43px auto 0; width: 100%; max-width: 790px; text-align: left; animation: arrive .9s .2s both; }
    .tabs { display: flex; justify-content: center; width: max-content; margin: 0 auto 18px; gap: 4px; padding: 4px; border-radius: 30px; background: #e9dfd270; }
    .tab { padding: 9px 20px; font-size: 14px; border: 0; color: var(--muted); background: transparent; border-radius: 24px; transition: color .2s, background .2s, box-shadow .2s; }
    .tab[aria-selected="true"] { background: #fffcf7; color: var(--ink); box-shadow: 0 2px 8px #67452a0d; }
    .terminal {
      position: relative; overflow: hidden; isolation: isolate; color: #f3e5ce; background: #302219;
      border: 1px solid #573b29; border-radius: 15px;
      box-shadow: 0 12px 30px -17px #5e341b5c, 0 2px 0 #e1cbb1;
      transition: box-shadow .35s, transform .35s;
    }
    .terminal::before {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
      background: radial-gradient(340px circle at var(--light-x, 50%) var(--light-y, 50%), #d5a06526, transparent 70%);
      transition: opacity .4s;
    }
    .terminal:hover { transform: translateY(-2px); box-shadow: 0 17px 35px -18px #5e341b70, 0 2px 0 #d7b491; }
    .terminal:hover::before { opacity: 1; }
    .command-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 28px 25px; min-height: 112px; }
    .prompt { color: #c39467; font: 17px var(--mono); }
    .command { font: 13px/1.85 var(--mono); overflow-wrap: anywhere; min-width: 0; }
    .copy { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-width: 111px; min-height: 46px; padding: 11px 16px; border: 1px solid #f0d8b2; border-radius: 8px; background: #f3e2c4; color: #402b1d; font-size: 14px; transition: background .2s, transform .2s, box-shadow .2s; }
    .copy svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .copy:hover { background: #fff1d9; transform: translateY(-1px); box-shadow: 0 4px 15px #10090030; }
    .copy:active { transform: scale(.96); }
    .copy:disabled { cursor: wait; }
    .copy.copied { background: #d6e1bf; border-color: #d6e1bf; animation: copy-pop .35s ease-out; }
    .copy-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .copy-status.is-error { position: static; width: auto; height: auto; margin: 12px 0 0; clip-path: none; white-space: normal; font-size: 14px; text-align: center; }
    footer { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 24px 0 28px; font-size: 13px; color: var(--muted); }
    .footer-links { display: flex; gap: 23px; align-items: center; }
    .license { font-size: 12px; opacity: .7; }
    @keyframes float { 0%,100% { transform: translateY(2px); } 50% { transform: translateY(-7px); } }
    @keyframes shadow { 0%,100% { transform: translateY(-2px) scale(1); opacity: .9; } 50% { transform: translateY(7px) scale(.85); opacity: .5; } }
    @keyframes steam { 0% { opacity: 0; transform: translate(0, 14px) scaleX(.85); } 25% { opacity: .5; } 70% { opacity: .2; } 100% { opacity: 0; transform: translate(5px, -25px) scaleX(1.1); } }
    @keyframes breathe { from { opacity: .55; } to { opacity: 1; } }
    @keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes clink { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 65% { transform: rotate(6deg); } }
    @keyframes ripple { 0% { opacity: .6; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.8); } }
    @keyframes copy-pop { 50% { transform: scale(1.045); } }
    @media (max-width: 700px) {
      .page { padding: 0 23px; }
      header { height: 76px; }
      .brand img { width: 32px; height: 32px; }
      nav { gap: 20px; font-size: 14px; }
      main { padding: 31px 0 44px; }
      .aura { height: 470px; top: 0; }
      .hero-art, .cup-stage, .cup-icon { width: 135px; height: 135px; }
      .steam { width: 135px; left: 0; top: -45px; }
      .cup-bob::after { left: 24px; }
      h1 { font-size: clamp(58px, 19.2vw, 75px); letter-spacing: -5px; margin-top: 26px; }
      .tagline { font-size: 18px; letter-spacing: 0; margin-top: 17px; }
      .install { margin-top: 32px; }
      .tabs { margin-bottom: 16px; }
      .tab { padding: 9px 21px; }
      .command-row { grid-template-columns: 15px minmax(0, 1fr); gap: 13px 10px; padding: 22px 19px 19px; }
      .prompt { align-self: start; margin-top: 3px; }
      .command { font-size: 12px; line-height: 1.9; }
      .copy { grid-column: 1 / -1; width: 100%; margin-top: 2px; }
      footer { font-size: 12px; padding: 20px 0 23px; gap: 12px; flex-wrap: wrap; }
      .footer-links { gap: 19px; }
      .license { font-size: 11px; }
    }
    @media (max-height: 760px) and (min-width: 701px) {
      header { height: 72px; } main { padding: 18px 0 30px; }
      .hero-art, .cup-stage, .cup-icon { width: 125px; height: 125px; }
      .steam { width: 125px; }
      h1 { font-size: 90px; margin-top: 20px; }
      .tagline { margin-top: 14px; }
      .install { margin-top: 28px; }
      footer { padding: 17px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .cup-stage, .terminal:hover { transform: none; }
      .steam path { opacity: .25; }
    }
  </style>

<body>
  <div class="page">
    <header>
      <a class="brand" href="./" aria-label="Steamcup 首页"><img src="media/steamcup-icon.png" alt="" width="36" height="36"></a>
      <nav aria-label="主导航"><a href="https://github.com/Longado/steamcup/releases/latest/download/Steamcup.zip">下载 Mac 版 ↓</a><a href="https://github.com/Longado/steamcup">GitHub ↗</a></nav>
    </header>
    <main id="hero">
      <div class="aura" aria-hidden="true"></div>
      <div class="hero-art">
        <button class="cup-stage" id="cup-stage" type="button" aria-label="给咖啡续一杯">
          <span class="brew-ring" aria-hidden="true"></span>
          <span class="cup-bob">
            <img class="cup-icon" src="media/steamcup-icon.png" alt="" width="160" height="160">
            <svg class="steam" viewBox="0 0 160 120" aria-hidden="true"><path d="M57 108 C40 88 72 79 56 57 S51 28 58 15"/><path d="M80 111 C64 94 93 77 80 59 S70 30 81 13"/><path d="M103 108 C89 90 119 79 104 57 S100 33 107 21"/></svg>
          </span>
        </button>
      </div>
      <h1>Steamcup<span>.</span></h1>
      <p class="tagline">合上电脑，让任务接着跑。</p>
      <section class="install" aria-label="安装 Steamcup">
        <div class="tabs" role="tablist" aria-label="选择安装方式">
          <button class="tab" id="terminal-tab" role="tab" aria-selected="true" aria-controls="install-panel" type="button" data-mode="terminal">终端安装</button>
          <button class="tab" id="agent-tab" role="tab" aria-selected="false" aria-controls="install-panel" tabindex="-1" type="button" data-mode="agent">给 Agent</button>
        </div>
        <div class="terminal" id="install-panel" role="tabpanel" aria-labelledby="terminal-tab">
          <div class="command-row"><span class="prompt" id="prompt-symbol" aria-hidden="true">$</span><code class="command" id="install-command">curl -fsSL https://longado.github.io/steamcup/install.sh | /bin/bash</code><button class="copy" id="copy-install" type="button" aria-label="复制安装命令"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="10" height="11" rx="2"/><path d="M12 6V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg><span id="copy-label">复制命令</span></button></div>
        </div>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
        <noscript><p>给 Agent：请阅读 https://longado.github.io/steamcup/install.md 并帮我安装 Steamcup。</p></noscript>
      </section>
    </main>
    <footer><span>macOS 14+ · Apple Silicon / Intel</span><div class="footer-links"><a href="https://github.com/Longado/steamcup/blob/main/README.zh-CN.md#快速开始">安装说明 ↗</a><a class="license" href="https://github.com/Longado/steamcup/blob/main/LICENSE">MIT</a></div></footer>
  </div>
  <script>
    const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
    const command = document.getElementById('install-command');
    const copy = document.getElementById('copy-install');
    const copyLabel = document.getElementById('copy-label');
    const status = document.getElementById('copy-status');
    const cup = document.getElementById('cup-stage');
    const hero = document.getElementById('hero');
    const panel = document.getElementById('install-panel');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let feedbackTimer, brewTimer;
    const modes = {
      terminal: {
        text: 'curl -fsSL https://longado.github.io/steamcup/install.sh | /bin/bash',
        symbol: '$', label: '复制安装命令', button: '复制命令'
      },
      agent: {
        text: '请阅读 https://longado.github.io/steamcup/install.md 并帮我安装 Steamcup。',
        symbol: '>', label: '复制给 Agent 的安装提示词', button: '复制提示词'
      }
    };
    let activeMode = modes.terminal;
    function brew() {
      if (reducedMotion.matches) return;
      clearTimeout(brewTimer);
      cup.classList.remove('brewing');
      void cup.offsetWidth;
      cup.classList.add('brewing');
      brewTimer = setTimeout(() => cup.classList.remove('brewing'), 1500);
    }
    function resetCopy() {
      clearTimeout(feedbackTimer);
      copy.classList.remove('copied');
      copyLabel.textContent = activeMode.button;
      status.textContent = '';
      status.classList.remove('is-error');
    }
    function selectMode(tab) {
      const mode = modes[tab.dataset.mode];
      activeMode = mode;
      tabs.forEach(item => {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
      });
      command.textContent = mode.text;
      panel.setAttribute('aria-labelledby', tab.id);
      document.getElementById('prompt-symbol').textContent = mode.symbol;
      copy.setAttribute('aria-label', mode.label);
      resetCopy();
    }
    tabs.forEach(tab => {
      tab.addEventListener('click', () => selectMode(tab));
      tab.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const next = event.key === 'Home' ? tabs[0] : event.key === 'End' ? tabs[tabs.length - 1] : tabs[(tabs.indexOf(tab) + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
        selectMode(next);
        next.focus();
      });
    });
    copy.addEventListener('click', async () => {
      copy.disabled = true;
      resetCopy();
      const text = command.textContent;
      try {
        await navigator.clipboard.writeText(text);
        if (command.textContent !== text) return;
        copyLabel.textContent = '已复制';
        copy.classList.add('copied');
        status.textContent = '已复制，粘贴即可。';
        brew();
        feedbackTimer = setTimeout(resetCopy, 2200);
      } catch {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(command);
        selection.removeAllRanges();
        selection.addRange(range);
        status.textContent = '请按 ⌘C 或 Ctrl+C 复制已选中的命令。';
        status.classList.add('is-error');
      } finally {
        copy.disabled = false;
      }
    });
    cup.addEventListener('click', brew);
    let pointerFrame = 0, pointerX = 0, pointerY = 0;
    hero.addEventListener('pointermove', event => {
      if (reducedMotion.matches || event.pointerType !== 'mouse') return;
      const bounds = hero.getBoundingClientRect();
      pointerX = (event.clientX - bounds.left) / bounds.width - .5;
      pointerY = (event.clientY - bounds.top) / bounds.height - .5;
      if (pointerFrame) return;
      pointerFrame = requestAnimationFrame(() => {
        hero.style.setProperty('--cup-x', pointerX * 13 + 'px');
        hero.style.setProperty('--cup-y', pointerY * 8 + 'px');
        hero.style.setProperty('--aura-x', pointerX * 42 + 'px');
        hero.style.setProperty('--aura-y', pointerY * 28 + 'px');
        pointerFrame = 0;
      });
    });
    hero.addEventListener('pointerleave', () => {
      cancelAnimationFrame(pointerFrame);
      pointerFrame = 0;
      ['--cup-x', '--cup-y', '--aura-x', '--aura-y'].forEach(key => hero.style.removeProperty(key));
    });
    panel.addEventListener('pointermove', event => {
      if (reducedMotion.matches || event.pointerType !== 'mouse') return;
      const bounds = panel.getBoundingClientRect();
      panel.style.setProperty('--light-x', event.clientX - bounds.left + 'px');
      panel.style.setProperty('--light-y', event.clientY - bounds.top + 'px');
    });
    reducedMotion.addEventListener('change', () => {
      if (!reducedMotion.matches) return;
      cancelAnimationFrame(pointerFrame);
      pointerFrame = 0;
      ['--cup-x', '--cup-y', '--aura-x', '--aura-y'].forEach(key => hero.style.removeProperty(key));
      cup.classList.remove('brewing');
    });
  </script>
</body>
